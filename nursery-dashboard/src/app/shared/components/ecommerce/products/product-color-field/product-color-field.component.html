<div>

  <input
    type="search"
    [(ngModel)]="search"
    placeholder="Search colors"
    aria-label="Search colors"
    class="mb-3 w-full rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm text-gray-800 outline-none focus:border-brand-500 dark:border-gray-700 dark:bg-gray-900 dark:text-white"
  />

  <div
    class="grid max-h-80 grid-cols-3 gap-2 overflow-y-auto pr-1 min-[480px]:grid-cols-4 sm:grid-cols-6"
  >

    @for (option of visibleColors; track option.name) {

      <button
        type="button"
        (click)="choose(option)"
        class="flex flex-col items-center gap-1 rounded-xl border border-gray-200 bg-white px-1 py-2 text-[11px] leading-tight transition dark:border-gray-700 dark:bg-gray-900"
        [class.ring-2]="isChosen(option)"
        [class.ring-brand-500]="isChosen(option)"
      >

        <span
          class="h-7 w-7 rounded-full border border-gray-300 dark:border-gray-600"
          [style.background]="option.hex"
        ></span>

        <span
          class="text-center text-gray-700 dark:text-gray-200"
        >
          {{ option.name }}
        </span>

      </button>

    }


    @if (visibleColors.length === 0 && !showMixed) {

      <p
        class="col-span-full px-1 py-3 text-sm text-gray-500 dark:text-gray-400"
      >
        No matching color. Use Custom and type its name.
      </p>

    }


    @if (showMixed) {

    <button
      type="button"
      (click)="chooseMixed()"
      class="flex flex-col items-center gap-1 rounded-xl border border-gray-200 bg-white px-1 py-2 text-[11px] leading-tight transition dark:border-gray-700 dark:bg-gray-900"
      [class.ring-2]="mixedChosen"
      [class.ring-brand-500]="mixedChosen"
    >

      <span
        class="h-7 w-7 rounded-full border border-gray-300 dark:border-gray-600"
        [style.background]="mixedSwatch"
      ></span>

      <span
        class="text-center text-gray-700 dark:text-gray-200"
      >
        Mixed
      </span>

    </button>

    }


    <button
      type="button"
      (click)="openCustom()"
      class="flex flex-col items-center gap-1 rounded-xl border border-gray-200 bg-white px-1 py-2 text-[11px] leading-tight transition dark:border-gray-700 dark:bg-gray-900"
      [class.ring-2]="customChosen"
      [class.ring-brand-500]="customChosen"
    >

      <span
        class="flex h-7 w-7 items-center justify-center rounded-full border border-dashed border-gray-400 text-xs text-gray-500"
        [style.background]="isCustomSelection ? selected.swatch : null"
      >
        @if (!isCustomSelection) {
          +
        }
      </span>

      <span
        class="text-center text-gray-700 dark:text-gray-200"
      >
        Custom
      </span>

    </button>

  </div>


  @if (showCustom) {

    <div
      class="mt-3 flex items-center gap-3"
    >

      <input
        type="color"
        [ngModel]="customPickerValue"
        (ngModelChange)="onCustomPicked($event)"
        aria-label="Choose a custom color"
        class="h-11 w-14 cursor-pointer rounded-lg border border-gray-300 bg-white p-1 dark:border-gray-700 dark:bg-gray-900"
      />

      <input
        type="text"
        [ngModel]="customNameValue"
        (ngModelChange)="onCustomName($event)"
        placeholder="Color name"
        aria-label="Custom color name"
        maxlength="40"
        class="min-w-0 flex-1 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm text-gray-800 outline-none focus:border-brand-500 dark:border-gray-700 dark:bg-gray-900 dark:text-white"
      />

    </div>

    <p
      class="mt-1 text-xs text-gray-500 dark:text-gray-400"
    >
      Pick the color, then type its name.
    </p>

  }


  @if (selected.colorName) {

    <div
      class="mt-3 flex items-center gap-3"
    >

      <span
        class="h-8 w-8 rounded-full border border-gray-300 dark:border-gray-600"
        [style.background]="selected.swatch"
      ></span>

      <span
        class="text-sm font-medium text-gray-800 dark:text-white"
      >
        {{ selected.colorName }}
      </span>

      <button
        type="button"
        (click)="clear()"
        class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-50 dark:border-gray-700 dark:bg-transparent dark:text-gray-300 dark:hover:bg-gray-800"
      >
        Clear
      </button>

    </div>

  }

</div>
