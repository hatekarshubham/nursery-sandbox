
<div
  class="w-full rounded-3xl bg-white px-7 py-8 shadow-[0_18px_50px_rgba(22,101,52,0.08)] sm:px-9 sm:py-10 dark:bg-gray-800 dark:shadow-none"
  style="font-family: Inter, sans-serif"
>
  <div>

    <!-- Heading -->
    <div class="mb-7">
      <h1 class="mb-2 text-3xl font-semibold text-[#166534] dark:text-[#86C48C]">
        Login
      </h1>

      <p class="text-sm text-[#6B7280] dark:text-gray-400">
        Enter your username and password to login!
      </p>
    </div>

    <!-- Login Form -->
    <form
      (ngSubmit)="onSignIn()"
      class="space-y-6"
    >

      <!-- Username -->
      <div>
        <app-label>
          Username <span class="text-error-500">*</span>
        </app-label>

        <app-input-field
          type="text"
          placeholder="Enter your username"
          [(value)]="email"
          name="email"
          className="!rounded-xl !border-[#E4EBE3] !bg-[#F4F7F2] !shadow-none focus:!border-[#43A047] focus:!ring-[#43A047]/20 dark:!border-gray-700 dark:!bg-gray-900 dark:!text-white"
          required
        />
      </div>

      <!-- Password -->
      <div>
        <app-label>
          Password <span class="text-error-500">*</span>
        </app-label>

        <div class="relative">

          <app-input-field
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter your password"
            [(value)]="password"
            name="password"
            className="!rounded-xl !border-[#E4EBE3] !bg-[#F4F7F2] !shadow-none focus:!border-[#43A047] focus:!ring-[#43A047]/20 dark:!border-gray-700 dark:!bg-gray-900 dark:!text-white"
            required
          />

          <!-- Password Visibility -->
          <span
            (click)="togglePasswordVisibility()"
            class="absolute z-30 -translate-y-1/2 cursor-pointer right-4 top-1/2"
          >

            @if (showPassword) {

              <!-- Eye Open -->
              <svg
                width="1em"
                height="1em"
                viewBox="0 0 20 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="fill-gray-500 dark:fill-gray-400 size-5"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M10.0002 13.8619C7.23361 13.8619 4.86803 12.1372 3.92328 9.70241C4.86804 7.26761 7.23361 5.54297 10.0002 5.54297C12.7667 5.54297 15.1323 7.26762 16.0771 9.70243C15.1323 12.1372 12.7667 13.8619 10.0002 13.8619ZM10.0002 4.04297C6.48191 4.04297 3.49489 6.30917 2.4155 9.4593C2.3615 9.61687 2.3615 9.78794 2.41549 9.94552C3.49488 13.0957 6.48191 15.3619 10.0002 15.3619C13.5184 15.3619 16.5055 13.0957 17.5849 9.94555C17.6389 9.78797 17.6389 9.6169 17.5849 9.45932C16.5055 6.30919 13.5184 4.04297C9.13525 4.04297 6.48191 4.04297 6.48191 4.04297Z"
                />
              </svg>

            } @else {

              <!-- Eye Closed -->
              <svg
                width="1em"
                height="1em"
                viewBox="0 0 20 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="fill-gray-500 dark:fill-gray-400 size-5"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M4.63803 3.57709C4.34513 3.2842 3.87026 3.2842 3.57737 3.57709C3.28447 3.86999 3.28447 4.34486 3.57737 4.63775L4.85323 5.91362C3.74609 6.84199 2.89363 8.06395 2.4155 9.45936C2.3615 9.61694 2.3615 9.78801 2.41549 9.94558C3.49488 13.0957 6.48191 15.3619 10.0002 15.3619C11.255 15.0737 12.4422 15.0737 13.4994 14.5598L15.3625 16.4229C15.6554 16.7158 16.1302 16.7158 16.4231 16.4229C16.716 16.13 16.716 15.6551 16.4231 15.3622L4.63803 3.57709ZM12.3608 13.4212L10.4475 11.5079C10.3061 11.5423 10.1584 11.5606 10.0064 11.5606H9.99151C8.96527 11.5606 8.13333 10.7286 8.13333 9.70237C8.13333 9.5461 8.15262 9.39434 8.18895 9.24933L5.91885 6.97923C5.03505 7.69015 4.34057 8.62704 3.92328 9.70247C4.86803 12.1373 7.23361 13.8619 10.0002 13.8619C10.8326 13.8619 11.6287 13.7058 12.3608 13.4212ZM16.0771 9.70249C15.7841 10.4569 15.3552 11.1432 14.8199 11.7311L15.8813 12.7925C16.6329 11.9813 17.2187 11.0143 17.5849 9.94561C17.6389 9.78803 17.6389 9.61696 17.5849 9.45938C16.5055 6.30919 13.5184 4.04303 10.0002 4.04303C9.13525 4.04303 8.30244 4.17999 7.52218 4.43338L8.75139 5.66259C9.1556 5.58413 9.57311 5.54303 10.0002 5.54303C12.7667 5.54303 15.1323 7.26768 16.0771 9.70249Z"
                />
              </svg>

            }

          </span>

        </div>
      </div>

      <!-- Remember Me -->
      <div class="flex items-center">
        <div class="flex items-center gap-3">
          <app-checkbox
            [(checked)]="isChecked"
            label="Keep me logged in"
            className="!rounded-md !border-[#D5E0D4] checked:!border-[#166534] checked:!bg-[#166534]"
          />
        </div>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        [disabled]="isLoading"
        [attr.aria-busy]="isLoading"
        class="flex w-full items-center justify-center gap-2 rounded-xl bg-[#166534] px-4 py-3 text-sm font-semibold text-white transition hover:bg-[#14532D] disabled:cursor-not-allowed disabled:opacity-70"
      >

        @if (isLoading) {

          <!-- Animated Loading Spinner -->
          <svg
            class="h-5 w-5 animate-spin"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            />

            <path
              class="opacity-90"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
            />
          </svg>

          <span>Signing in...</span>

        } @else {

          <span>Login</span>

          <svg
            class="h-4 w-4"
            viewBox="0 0 20 20"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 10h12M12 6l4 4-4 4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

        }

      </button>

    </form>

  </div>
</div>
