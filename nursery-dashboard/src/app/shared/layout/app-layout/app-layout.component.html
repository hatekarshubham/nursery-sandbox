<div class="h-screen overflow-hidden xl:flex">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
      class="flex h-screen min-w-0 flex-1 flex-col overflow-hidden transition-all duration-300 ease-in-out"
      [ngClass]="{
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <!-- app header start -->
    <app-header/>
    <!-- app header end -->
    <div class="min-h-0 flex-1 overflow-y-auto">
      <div class="mx-auto w-full min-w-0 max-w-(--breakpoint-2xl) p-4 md:p-6">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
