<div
  class="relative min-h-screen bg-[#EEF3E6] bg-[url('/images/login/login-bg.jpg')] bg-cover bg-center bg-no-repeat text-[#1F2933] dark:bg-gray-900 dark:bg-none dark:text-gray-100"
  style="font-family: Inter, sans-serif"
>
  <div class="flex min-h-screen flex-col lg:flex-row">

    <aside
      class="relative hidden lg:flex lg:w-1/2 lg:flex-col lg:justify-between"
    >

      <div class="relative z-10 px-14 pt-16 xl:px-20 xl:pt-20">

        <h1
          class="mt-10 max-w-md text-4xl font-semibold leading-tight tracking-tight text-[#243028] dark:text-white"
        >
          Plants for a
          <span class="text-[#166534] dark:text-[#86C48C]">Greener</span>
          <span class="block text-[#166534] dark:text-[#86C48C]">Brighter Tomorrow</span>
        </h1>

        <span
          class="mt-5 block h-1 w-16 rounded-full bg-[#43A047]"
        ></span>

        <p class="mt-5 text-sm text-[#6B7280] dark:text-gray-400">
          Quality plants
          <span class="px-1.5 text-[#43A047]">·</span>
          Healthy homes
          <span class="px-1.5 text-[#43A047]">·</span>
          A greener world
        </p>

      </div>

    </aside>

    <main
      class="flex flex-1 flex-col items-center justify-center px-5 py-10 sm:px-8"
    >

      <img
        src="/images/logo/gnlogo.svg"
        alt="Gayatri Nursery"
        class="mb-8 h-11 w-auto"
      />

      <ng-content></ng-content>

    </main>

  </div>

  <div class="fixed bottom-6 right-6 z-50 hidden sm:block">
    <app-theme-toggle-two />
  </div>
</div>
