
name: Deploy Firebase Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: nursery-dashboard
        run: npm ci --legacy-peer-deps

      - name: Build Angular Production
        working-directory: nursery-dashboard
        run: npm run build -- --configuration=production

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/415853488027/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-hosting-deployer@gayatri-nursery-production.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Production Hosting
        run: |
          firebase deploy \
            --only hosting \
            --project gayatri-nursery-production \
            --non-interactive
